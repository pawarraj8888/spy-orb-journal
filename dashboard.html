<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMOM · Systematic Signal Research</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body { background: #fff; color: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; font-size: 14px; line-height: 1.5; }

.topbar { background: rgba(255,255,255,0.95); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid #d2d2d7; position: sticky; top: 0; z-index: 100; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; height: 52px; }
.topbar-logo { font-size: 17px; font-weight: 600; color: #1d1d1f; letter-spacing: -0.01em; }
.topbar-right { display: flex; align-items: center; gap: 20px; }
.topbar-right span { font-size: 12px; color: #6e6e73; }
.live-badge { display: flex; align-items: center; gap: 5px; background: #f5f5f7; border-radius: 100px; padding: 4px 10px; font-size: 11px; color: #1d1d1f; font-weight: 500; }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: #34c759; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* PROMINENT INSTRUMENT SWITCHER */
.inst-panel { background: #1d1d1f; padding: 20px 48px; display: flex; align-items: center; gap: 20px; }
.inst-panel-label { font-size: 10px; font-weight: 700; color: #6e6e73; text-transform: uppercase; letter-spacing: 0.1em; white-space: nowrap; padding-right: 20px; border-right: 1px solid #3a3a3c; }
.inst-cards { display: flex; gap: 12px; }
.inst-card { display: flex; flex-direction: column; gap: 3px; padding: 14px 22px; border-radius: 12px; border: 1.5px solid #3a3a3c; background: #2c2c2e; cursor: pointer; transition: all 0.2s; min-width: 200px; font-family: inherit; text-align: left; }
.inst-card:hover { border-color: #0a84ff; background: #1c2a3a; }
.inst-card.active { border-color: #0a84ff; background: #0a84ff18; box-shadow: 0 0 0 3px #0a84ff22; }
.ic-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
.ic-ticker { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: #fff; }
.inst-card.active .ic-ticker { color: #0a84ff; }
.ic-badge { font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: 100px; letter-spacing: 0.04em; }
.ic-badge.paper { background: #0d3d20; color: #34c759; }
.ic-badge.bt    { background: #3a2e00; color: #ffd60a; }
.ic-name { font-size: 11px; color: #8e8e93; margin-bottom: 6px; }
.ic-stat { font-size: 14px; font-weight: 600; color: #ebebf5; }
.inst-card.active .ic-stat { color: #0a84ff; }
.ic-sub { font-size: 10px; color: #636366; margin-top: 1px; }

/* HERO */
.hero { padding: 40px 48px 0; border-bottom: 1px solid #d2d2d7; }
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 48px; margin-bottom: 32px; }
.hero-title { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 10px; color: #1d1d1f; max-width: 500px; }
.hero-sub { font-size: 13px; color: #6e6e73; max-width: 460px; line-height: 1.6; }
.hero-kpis { display: flex; gap: 0; border: 1px solid #d2d2d7; border-radius: 12px; overflow: hidden; flex-shrink: 0; }
.kpi { padding: 14px 20px; border-right: 1px solid #d2d2d7; display: flex; flex-direction: column; gap: 4px; }
.kpi:last-child { border-right: none; }
.kpi-label { font-size: 11px; color: #6e6e73; white-space: nowrap; }
.kpi-val { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.kpi-val.blue { color: #0066cc; }
.kpi-val.green { color: #1d8348; }
.kpi-val.amber { color: #9a5e00; }

.tabs-wrap { display: flex; overflow-x: auto; }
.tab-btn { padding: 12px 18px; font-size: 13px; color: #6e6e73; background: none; border: none; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; transition: color 0.15s; font-family: inherit; }
.tab-btn:hover { color: #1d1d1f; }
.tab-btn.active { color: #0066cc; font-weight: 500; border-bottom-color: #0066cc; }

.tab-pane { display: none; padding: 36px 48px; }
.tab-pane.active { display: block; }

.metric-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
.metric-card { background: #f5f5f7; border-radius: 12px; padding: 18px; }
.mc-label { font-size: 11px; color: #6e6e73; margin-bottom: 6px; }
.mc-val { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 2px; }
.mc-val.blue { color: #0066cc; }
.mc-val.green { color: #1d8348; }
.mc-val.amber { color: #9a5e00; }
.mc-sub { font-size: 11px; color: #6e6e73; }

.s-title { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 18px; }
.callout { background: #f0f4ff; border-radius: 12px; padding: 18px 22px; font-size: 13px; color: #1d3a7a; line-height: 1.7; margin-top: 20px; }

.year-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-bottom: 24px; }
.yc { background: #f5f5f7; border-radius: 10px; padding: 12px; position: relative; overflow: hidden; }
.yc::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.yc.pos::before { background: #34c759; }
.yc.neg::before { background: #ff3b30; }
.yc-yr { font-size: 11px; color: #6e6e73; margin-bottom: 5px; }
.yc-pnl { font-size: 13px; font-weight: 600; margin-bottom: 7px; }
.yc.pos .yc-pnl { color: #1d8348; }
.yc.neg .yc-pnl { color: #c0392b; }
.yc-bar { height: 2px; background: #e5e5ea; border-radius: 1px; margin-bottom: 7px; }
.yc-bar-fill { height: 100%; border-radius: 1px; }
.yc.pos .yc-bar-fill { background: #34c759; }
.yc.neg .yc-bar-fill { background: #ff3b30; }
.yc-rows { display: flex; flex-direction: column; gap: 2px; }
.yc-row { display: flex; justify-content: space-between; font-size: 10px; }
.yc-row .yk { color: #6e6e73; }
.yc-row .yv { color: #1d1d1f; font-weight: 500; }

.data-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 16px; }
.data-table th { padding: 9px 14px; text-align: left; font-size: 11px; font-weight: 500; color: #6e6e73; border-bottom: 1px solid #d2d2d7; background: #f5f5f7; white-space: nowrap; }
.data-table td { padding: 11px 14px; border-bottom: 1px solid #f0f0f5; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: #f9f9fb; }
.data-table .sel td { background: #f0f4ff; }
.td-blue { color: #0066cc; font-weight: 500; }
.td-green { color: #1d8348; font-weight: 500; }
.td-red { color: #c0392b; font-weight: 500; }
.td-muted { color: #6e6e73; }
.sel-badge { display: inline-block; background: #0066cc; color: #fff; font-size: 9px; font-weight: 600; padding: 1px 6px; border-radius: 100px; margin-left: 6px; }

.sig-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.sig-block { border: 1px solid #d2d2d7; border-radius: 12px; overflow: hidden; }
.sig-head { padding: 10px 16px; background: #f5f5f7; border-bottom: 1px solid #d2d2d7; font-size: 11px; font-weight: 500; color: #6e6e73; }
.sig-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 16px; border-bottom: 1px solid #f0f0f5; font-size: 13px; }
.sig-row:last-child { border-bottom: none; }
.sig-res { display: flex; align-items: center; gap: 8px; }
.sig-pval { font-size: 11px; color: #6e6e73; }
.pass { color: #1d8348; font-size: 11px; font-weight: 600; }
.warn { color: #9a5e00; font-size: 11px; font-weight: 600; }
.fail-r { color: #c0392b; font-size: 11px; font-weight: 600; }

.compare-wrap { border: 1px solid #d2d2d7; border-radius: 12px; overflow: hidden; margin-top: 20px; }
.compare-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.compare-table th { padding: 9px 16px; font-size: 11px; font-weight: 500; background: #f5f5f7; border-bottom: 1px solid #d2d2d7; text-align: left; }
.compare-table th.es-col { color: #0066cc; }
.compare-table th.spy-col { color: #6e6e73; }
.compare-table td { padding: 9px 16px; border-bottom: 1px solid #f0f0f5; }
.compare-table tr:last-child td { border-bottom: none; }
.metric-name { color: #6e6e73; font-size: 12px; }
.es-val { font-weight: 500; }
.spy-val { color: #6e6e73; }
.better { color: #1d8348; font-weight: 600; }

.spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.spec-block { border: 1px solid #d2d2d7; border-radius: 12px; overflow: hidden; }
.spec-head { padding: 10px 16px; background: #f5f5f7; border-bottom: 1px solid #d2d2d7; font-size: 11px; font-weight: 500; color: #6e6e73; }
.spec-row { display: flex; justify-content: space-between; padding: 8px 16px; border-bottom: 1px solid #f0f0f5; font-size: 13px; }
.spec-row:last-child { border-bottom: none; }
.sk { color: #6e6e73; }
.sv.blue { color: #0066cc; font-weight: 500; }

.cap-wrap { border: 1px solid #d2d2d7; border-radius: 12px; overflow: hidden; }
.cap-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.cap-table th { padding: 9px 16px; font-size: 11px; font-weight: 500; color: #6e6e73; background: #f5f5f7; border-bottom: 1px solid #d2d2d7; text-align: left; }
.cap-table td { padding: 10px 16px; border-bottom: 1px solid #f0f0f5; }
.cap-table tr:last-child td { border-bottom: none; }
.cap-ok   { color: #1d8348; font-weight: 500; }
.cap-warn { color: #9a5e00; font-weight: 500; }

.j-controls { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.j-btn { padding: 6px 14px; border-radius: 100px; background: #f5f5f7; border: none; font-size: 12px; color: #1d1d1f; cursor: pointer; font-family: inherit; }
.j-btn:hover { background: #e5e5ea; }
.j-btn.active { background: #0066cc; color: #fff; font-weight: 500; }
.j-count { font-size: 12px; color: #6e6e73; }
.j-search { margin-left: auto; padding: 6px 12px; background: #f5f5f7; border: 1px solid transparent; border-radius: 8px; font-size: 12px; outline: none; width: 160px; font-family: inherit; }
.j-search:focus { border-color: #0066cc; background: #fff; }
.j-search::placeholder { color: #aeaeb2; }
.j-wrap { border: 1px solid #d2d2d7; border-radius: 12px; overflow: hidden; overflow-x: auto; }
.j-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 900px; }
.j-table th { padding: 9px 12px; text-align: left; font-size: 11px; font-weight: 500; color: #6e6e73; border-bottom: 1px solid #d2d2d7; background: #f5f5f7; white-space: nowrap; }
.j-table td { padding: 8px 12px; border-bottom: 1px solid #f0f0f5; white-space: nowrap; }
.j-table tr:last-child td { border-bottom: none; }
.j-table tr:hover td { background: #f9f9fb; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 100px; font-size: 10px; font-weight: 600; }
.badge.win     { background: #d4f0de; color: #1d8348; }
.badge.loss    { background: #fde8e8; color: #c0392b; }
.badge.notrade { background: #f0f0f5; color: #aeaeb2; }
.badge.flat    { background: #f0f0f5; color: #6e6e73; }
.badge.pending { background: #ddeeff; color: #0055aa; }
.td-live { color: #0066cc; font-weight: 500; }
.td-bt { color: #aeaeb2; }
.pnl-pos { color: #1d8348; font-weight: 500; }
.pnl-neg { color: #c0392b; font-weight: 500; }
.fomc-pill { display: inline-block; font-size: 9px; color: #9a5e00; background: #fff4cc; border-radius: 4px; padding: 1px 5px; margin-left: 4px; font-weight: 600; vertical-align: middle; }
.info-banner { background: #fff8e6; border: 1px solid #ffe8a0; border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #7a5800; margin-bottom: 14px; }

.regime-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.rc { background: #f5f5f7; border-radius: 12px; padding: 16px; }
.rc-label { font-size: 11px; color: #6e6e73; margin-bottom: 5px; }
.rc-val { font-size: 20px; font-weight: 600; margin-bottom: 3px; }
.rc-val.pass { color: #1d8348; }

footer { padding: 18px 48px; border-top: 1px solid #d2d2d7; display: flex; justify-content: space-between; font-size: 11px; color: #aeaeb2; }

@media (max-width: 900px) {
  .topbar, .hero, .tab-pane, .inst-panel { padding-left: 20px; padding-right: 20px; }
  .metric-grid { grid-template-columns: 1fr 1fr; }
  .year-row { grid-template-columns: repeat(3,1fr); }
  .sig-wrap, .spec-grid { grid-template-columns: 1fr; }
  .hero-top { flex-direction: column; }
  .inst-cards { flex-wrap: wrap; }
  .inst-card { min-width: 160px; }
}
</style>
</head>

let inst='spy', trades=[], filt='all', srch='';

function switchInstrument(id,btn){
  inst=id; trades=[]; filt='all'; srch='';
  document.querySelectorAll('.inst-card').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  buildHero(); buildTabs(); activateFirst();
}

function buildHero(){
  const d=D[inst];
  document.getElementById('hero-title').innerHTML=d.title;
  document.getElementById('hero-sub').textContent=d.sub;
  document.getElementById('hero-kpis').innerHTML=d.kpis.map(k=>`<div class="kpi"><span class="kpi-label">${k.label}</span><span class="kpi-val ${k.cls}">${k.val}</span></div>`).join('');
}

function buildTabs(){
  document.getElementById('tabs-wrap').innerHTML=D[inst].tabs.map(t=>`<button class="tab-btn" onclick="switchTab('${t.id}',this)">${t.l}</button>`).join('');
}

function activateFirst(){
  const btn=document.querySelector('.tab-btn');
  if(btn){btn.classList.add('active'); renderTab(D[inst].tabs[0].id);}
}

function switchTab(id,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderTab(id);
}

function wrap(html){return `<div class="tab-pane active" style="display:block;padding:36px 48px">${html}</div>`;}

function renderTab(id){
  const c=document.getElementById('tab-content-container');
  const d=D[inst];
  if(id==='journal')     {c.innerHTML=buildJournal();loadTrades();return;}
  if(id==='overview')    {c.innerHTML=buildOverview(d);return;}
  if(id==='annual')      {c.innerHTML=buildAnnual(d);return;}
  if(id==='significance'){c.innerHTML=buildSig(d);return;}
  if(id==='leverage')    {c.innerHTML=buildLev(d);return;}
  if(id==='capacity')    {c.innerHTML=buildCap(d);return;}
  if(id==='spec')        {c.innerHTML=buildSpec(d);return;}
  if(id==='regime')      {c.innerHTML=buildRegime();return;}
}

function buildOverview(d){
  const cards=d.overview.metrics.map(m=>`<div class="metric-card"><div class="mc-label">${m.label}</div><div class="mc-val ${m.cls}">${m.val}</div><div class="mc-sub">${m.sub}</div></div>`).join('');
  let cmp='';
  if(inst==='es') cmp=`<div class="s-title" style="margin-top:28px">ES Futures vs SPY ETF</div><div class="compare-wrap"><table class="compare-table"><thead><tr><th>Metric</th><th class="es-col">ES Futures</th><th class="spy-col">SPY ETF</th></tr></thead><tbody>
    <tr><td class="metric-name">Ann. Return (2x)</td><td class="es-val better">26.7%</td><td class="spy-val">21.3%</td></tr>
    <tr><td class="metric-name">Sharpe</td><td class="es-val better">2.53</td><td class="spy-val">2.05</td></tr>
    <tr><td class="metric-name">Max Drawdown</td><td class="es-val better">-11.3%</td><td class="spy-val">-20.7%</td></tr>
    <tr><td class="metric-name">Calmar Ratio</td><td class="es-val better">2.29</td><td class="spy-val">1.03</td></tr>
    <tr><td class="metric-name">Positive Years</td><td class="es-val better">7 / 7</td><td class="spy-val">6 / 7</td></tr>
    <tr><td class="metric-name">Worst Year</td><td class="es-val better">+$1,275</td><td class="spy-val">-$5,659</td></tr>
    <tr><td class="metric-name">Capacity at $10M</td><td class="es-val better">Minimal impact</td><td class="spy-val">Too large</td></tr>
    <tr><td class="metric-name">Capacity at $100M</td><td class="es-val better">Algo execution</td><td class="spy-val">Impossible</td></tr>
  </tbody></table></div>`;
  return wrap(`<div class="metric-grid">${cards}</div><div class="callout">${d.overview.callout}</div>${cmp}`);
}

function buildAnnual(d){
  const mx=Math.max(...d.annual.map(x=>Math.abs(x.pnl)));
  const cards=d.annual.map(x=>{
    const pos=x.pnl>=0;
    return `<div class="yc ${pos?'pos':'neg'}"><div class="yc-yr">${x.year}</div><div class="yc-pnl">${(pos?'+':'')}$${Math.abs(x.pnl).toLocaleString()}</div><div class="yc-bar"><div class="yc-bar-fill" style="width:${Math.abs(x.pnl)/mx*100}%"></div></div><div class="yc-rows"><div class="yc-row"><span class="yk">Trades</span><span class="yv">${x.trades}</span></div><div class="yc-row"><span class="yk">Win %</span><span class="yv">${x.wr}%</span></div></div></div>`;
  }).join('');
  const rows=d.annual.map(x=>{const pos=x.pnl>=0;return `<tr><td>${x.year}</td><td class="${pos?'td-green':'td-red'}">${(pos?'+':'')}$${Math.abs(x.pnl).toLocaleString()}</td><td>${x.trades}</td><td>${x.wr}%</td><td class="${parseFloat(x.meanr)>=0?'td-green':'td-red'}">${x.meanr}</td><td class="td-muted">${x.regime}</td></tr>`;}).join('');
  return wrap(`<div class="s-title">Annual P&L · Out-of-Sample 2019 to 2025</div><div class="year-row">${cards}</div><table class="data-table"><thead><tr><th>Year</th><th>Net P&L ($100k base)</th><th>Signals</th><th>Win Rate</th><th>Mean R</th><th>Market Regime</th></tr></thead><tbody>${rows}</tbody></table>`);
}

function buildSig(d){
  const tests=d.sig.tests.map(t=>`<div class="sig-row"><span>${t.t}</span><span class="sig-res"><span class="sig-pval">${t.d}</span><span class="${t.v==='pass'?'pass':t.v==='warn'?'warn':'fail-r'}">${t.l}</span></span></div>`).join('');
  const stress=d.sig.stress.map(s=>`<div class="sig-row"><span>${s.p}</span><span class="sig-res"><span class="sig-pval">${s.n}</span><span class="${s.v==='pass'?'pass':s.v==='warn'?'warn':'fail-r'}">${s.l}</span></span></div>`).join('');
  return wrap(`<div class="s-title">Statistical Significance</div><div class="sig-wrap"><div class="sig-block"><div class="sig-head">Hypothesis Tests · H0: E[R] = 0</div>${tests}</div><div class="sig-block"><div class="sig-head">Regime Stress Tests · OOS 2019 to 2025</div>${stress}</div></div><div class="callout">${d.sig.callout}</div>`);
}

function buildLev(d){
  const rows=d.lev.rows.map(r=>{
    const s=r.sel;
    const ddStyle=r.ddred?'color:#c0392b;font-weight:500':'color:#1d8348;font-weight:500';
    return `<tr class="${s?'sel':''}"><td class="${s?'td-blue':'td-muted'}">${s?'<strong>'+r.lev+'</strong>':r.lev}${s?'<span class="sel-badge">LIVE</span>':''}</td><td class="${s?'td-blue':'td-muted'}">${s?'<strong>'+r.final+'</strong>':r.final}</td><td class="${s?'td-blue':'td-muted'}">${r.total}</td><td class="${s?'td-blue':'td-muted'}">${r.ann}</td><td class="${s?'td-blue':'td-muted'}">${r.sh}</td><td style="${ddStyle}">${r.dd}</td><td class="${s?'td-blue':'td-muted'}">${r.cal}</td><td>${r.worst}</td></tr>`;
  }).join('');
  return wrap(`<div class="s-title">Leverage Sensitivity</div><table class="data-table"><thead><tr><th>Leverage</th><th>Final Equity</th><th>Total Return</th><th>Ann. Return</th><th>Sharpe</th><th>Max DD</th><th>Calmar</th><th>Worst Year</th></tr></thead><tbody>${rows}</tbody></table><p style="font-size:12px;color:#6e6e73;line-height:1.7;margin-top:12px">${d.lev.note}</p>`);
}

function buildCap(d){
  const rows=d.capacity.rows.map(r=>`<tr><td style="font-weight:500">${r.a}</td><td>${r.c.toLocaleString()}</td><td>${r.p}</td><td>${r.i}</td><td class="${r.cls}">${r.v}</td></tr>`).join('');
  return wrap(`<div class="s-title">Market Impact and Capacity Analysis</div><div class="cap-wrap"><table class="cap-table"><thead><tr><th>Account Size</th><th>Contracts Required</th><th>% of Median 9:45 Bar</th><th>Impact per Contract</th><th>Verdict</th></tr></thead><tbody>${rows}</tbody></table></div><p style="font-size:12px;color:#6e6e73;line-height:1.7;margin-top:12px">${d.capacity.note}</p><div class="callout">ES Futures solve the capacity problem that limits the SPY ETF version. At $10M, market impact is minimal at 2.4% of a single 5-minute bar. At $100M, algorithmic execution splits the order over 2 to 3 minutes, keeping impact manageable. This is a 200x capacity improvement from the same underlying signal.</div>`);
}

function buildSpec(d){
  const blk=(title,rows)=>`<div class="spec-block"><div class="spec-head">${title}</div>${rows.map(r=>`<div class="spec-row"><span class="sk">${r.k}</span><span class="sv ${r.blue?'blue':''}">${r.v}</span></div>`).join('')}</div>`;
  return wrap(`<div class="s-title">Strategy Specification</div><div class="spec-grid">${blk('Signal Construction',d.spec.signal)}${blk('Position Sizing',d.spec.sizing)}${blk('Validation Methodology',d.spec.validation)}${blk('Live Execution',d.spec.execution)}</div>`);
}

function buildRegime(){
  const ds=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  return wrap(`<div class="s-title">Regime Monitor</div><div class="regime-grid"><div class="rc"><div class="rc-label">200-Day SMA</div><div class="rc-val pass">Above</div><div class="rc-sub">Price +2.9% above long-term trend</div></div><div class="rc"><div class="rc-label">Implied Volatility (VIX)</div><div class="rc-val pass">19.4</div><div class="rc-sub">Below 30 threshold · Normal regime</div></div><div class="rc"><div class="rc-label">ATR% vs 100-Day MA</div><div class="rc-val pass">1.64%</div><div class="rc-sub">Above MA (1.21%) · Momentum healthy</div></div><div class="rc"><div class="rc-label">Realized Vol (20-Day)</div><div class="rc-val pass">20.4%</div><div class="rc-sub">79th percentile · Elevated but healthy</div></div><div class="rc"><div class="rc-label">Regime Score</div><div class="rc-val pass">6 / 6</div><div class="rc-sub">All conditions favorable</div></div><div class="rc"><div class="rc-label">Signal Action</div><div class="rc-val pass">Active</div><div class="rc-sub">Full position sizing · ${ds}</div></div></div><div class="callout">Six daily conditions evaluated: price vs 200-day SMA, ATR% relative to 100-day moving average, VIX vs 30 threshold, VIX spike/crush pattern, 20-day realized volatility vs 10th and 90th historical percentiles. Score 4 of 6 or above means full sizing. Score 3 of 6 means half sizing. Score below 3 of 6 means no trade.</div>`);
}

function buildJournal(){
  const d=D[inst];
  const note=d.journalNote?`<div class="info-banner">${d.journalNote}</div>`:'';
  const liveBtn=inst==='spy'?'<button class="j-btn" onclick="setFilter(\'live\',this)">Live</button>':'';
  const cols=inst==='spy'
    ?['Date','Source','OR High','Entry','Stop','Target','Risk ($)','Vol Ratio','Result','P&L (R)']
    :['Date','OR High','OR Low','Entry','Stop','Target','Exit','Risk (pts)','Contracts','Vol Ratio','FOMC','Result','P&L (R)','P&L ($)'];
  const thead=cols.map(c=>`<th>${c}</th>`).join('');
  return wrap(`${note}<div class="j-controls">
    <button class="j-btn active" onclick="setFilter('all',this)">All Days</button>
    <button class="j-btn" onclick="setFilter('trades',this)">Trades Only</button>
    <button class="j-btn" onclick="setFilter('wins',this)">Wins</button>
    <button class="j-btn" onclick="setFilter('losses',this)">Losses</button>
    ${liveBtn}
    <span class="j-count" id="j-count"></span>
    <input class="j-search" type="text" placeholder="Search date..." oninput="setSearch(this.value)"/>
  </div>
  <div class="j-wrap"><table class="j-table">
    <thead><tr>${thead}</tr></thead>
    <tbody id="j-tbody"><tr><td colspan="14" style="text-align:center;padding:40px;color:#aeaeb2" id="j-loading">Loading trades...</td></tr></tbody>
  </table></div>`);
}

async function loadTrades(){
  const d=D[inst];
  try{
    const res=await fetch(d.journalUrl);
    if(!res.ok)throw new Error('HTTP '+res.status);
    trades=await res.json();
    trades.sort((a,b)=>b.date.localeCompare(a.date));
    const el=document.getElementById('j-loading');
    if(el)el.style.display='none';
    renderJournal();
  }catch(e){
    const el=document.getElementById('j-loading');
    if(el)el.textContent=inst==='es'
      ?'Run generate_es_trades.py then push es_trades.json to your GitHub repo to see ES trades here.'
      :'Error loading trades: '+e.message;
  }
}

function setFilter(f,btn){
  filt=f;
  document.querySelectorAll('.j-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderJournal();
}

function setSearch(v){srch=v.toLowerCase();renderJournal();}

function renderJournal(){
  let data=trades;
  if(srch)data=data.filter(d=>d.date.includes(srch));
  if(filt==='trades')data=data.filter(d=>d.result!=='NO TRADE');
  if(filt==='wins')  data=data.filter(d=>d.result==='WIN');
  if(filt==='losses')data=data.filter(d=>d.result==='LOSS');
  if(filt==='live')  data=data.filter(d=>d.source==='live');
  const ct=document.getElementById('j-count');
  if(ct)ct.textContent=data.length+' records';
  const tb=document.getElementById('j-tbody');
  if(!tb)return;
  if(!data.length){tb.innerHTML='<tr><td colspan="14" style="text-align:center;padding:32px;color:#aeaeb2">No records match this filter</td></tr>';return;}

  const fp=v=>v!=null?Number(v).toFixed(2):'n/a';
  const fr=v=>v!=null&&v!==0?(v>0?'+':'')+Number(v).toFixed(2)+'R':'n/a';

  if(inst==='spy'){
    tb.innerHTML=data.slice(0,400).map(d=>{
      const bc=d.result==='WIN'?'win':d.result==='LOSS'?'loss':d.result==='PENDING'?'pending':d.result==='NO TRADE'?'notrade':'flat';
      const pc=d.pnl_r>0?'pnl-pos':d.pnl_r<0?'pnl-neg':'';
      return `<tr><td style="color:#6e6e73">${d.date}</td><td class="${d.source==='live'?'td-live':'td-bt'}">${d.source}</td><td>${d.or_high?'$'+Number(d.or_high).toFixed(2):'n/a'}</td><td>${d.entry?'$'+Number(d.entry).toFixed(2):'n/a'}</td><td>${d.stop?'$'+Number(d.stop).toFixed(2):'n/a'}</td><td>${d.target?'$'+Number(d.target).toFixed(2):'n/a'}</td><td>${d.risk_dollars?'$'+Number(d.risk_dollars).toLocaleString():'n/a'}</td><td>${d.vol_ratio?Number(d.vol_ratio).toFixed(2)+'x':'n/a'}</td><td><span class="badge ${bc}">${d.result}</span></td><td class="${pc}">${fr(d.pnl_r)}</td></tr>`;
    }).join('');
  }else{
    tb.innerHTML=data.slice(0,400).map(d=>{
      const bc=d.result==='WIN'?'win':d.result==='LOSS'?'loss':d.result==='NO TRADE'?'notrade':'flat';
      const pc=d.pnl_r>0?'pnl-pos':d.pnl_r<0?'pnl-neg':'';
      const pdol=d.pnl_dollars!=null&&d.pnl_dollars!==0?`<span class="${d.pnl_dollars>0?'pnl-pos':'pnl-neg'}">${d.pnl_dollars>0?'+':''}$${Math.abs(d.pnl_dollars).toLocaleString()}</span>`:'n/a';
      const fomc=d.is_fomc?'<span class="fomc-pill">FOMC</span>':'No';
      return `<tr><td style="color:#6e6e73">${d.date}${d.is_fomc?'<span class="fomc-pill">FOMC</span>':''}</td><td>${fp(d.or_high)}</td><td>${fp(d.or_low)}</td><td>${fp(d.entry)}</td><td>${fp(d.stop)}</td><td>${fp(d.target)}</td><td>${fp(d.exit_price)}</td><td>${d.risk_pts!=null?d.risk_pts+' pts':'n/a'}</td><td>${d.contracts!=null?d.contracts:'n/a'}</td><td>${d.vol_ratio!=null?Number(d.vol_ratio).toFixed(2)+'x':'n/a'}</td><td>${fomc}</td><td><span class="badge ${bc}">${d.result}</span></td><td class="${pc}">${fr(d.pnl_r)}</td><td>${pdol}</td></tr>`;
    }).join('');
  }
}

document.getElementById('footer-date').textContent='Updated '+new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
buildHero(); buildTabs(); activateFirst();
</script>
